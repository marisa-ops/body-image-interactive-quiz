<style>
/* ============================================================
   VISUAL CONFIGURATION — edit colours, fonts & spacing here
   Everything below is driven from these variables. Changing a
   value here updates the whole quiz consistently.
   ============================================================ */
:root{
  /* ---- Colour palette (matched to kokoncoaching.com) ---- */
  --color-bg:            #FBF8F3;   /* main background, warm off-white */
  --color-bg-card:       #FFFFFF;   /* answer/card surfaces */
  --color-text:          #211D18;   /* primary text, warm near-black */
  --color-text-muted:    #6B6459;   /* secondary / helper text */
  --color-accent:        #C6A06B;   /* caramel/gold — headline highlight */
  --color-accent-soft:   #EFE4D3;   /* soft gold tint for backgrounds */
  --color-border:        #E7DFD2;   /* hairline borders */
  --color-button-bg:     #1B1815;   /* primary CTA background (near-black) */
  --color-button-text:   #FFFFFF;   /* primary CTA text */
  --color-progress:      #C6A06B;   /* progress bar fill */
  --color-progress-track:#EDE7DB;   /* progress bar track */

  /* ---- Typography ---- */
  --font-display: 'Playfair Display', Georgia, serif;   /* headlines */
  --font-body:    'Lora', Georgia, serif;                /* body copy */
  --font-label:   'Lora', Georgia, serif;                /* eyebrows/labels */
  --font-script:  'Mrs Saint Delafield', cursive;         /* signature-style accent, matched to logo tagline */

  /* ---- Sizing / spacing ---- */
  --radius-card:  4px;
  --radius-pill:  999px;
  --max-width:    640px;
}

*{box-sizing:border-box;}

/* Branded focus states — visible for keyboard navigation, styled
   to match the palette rather than the browser's default blue */
a:focus-visible,
button:focus-visible{
  outline: 2px solid var(--color-accent);
  outline-offset: 3px;
  border-radius: 4px;
}
.answer-btn:focus-visible{
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
html,body{margin:0;padding:0;}
body{
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:32px 20px 60px;
}
.app{
  width:100%;
  max-width:var(--max-width);
}

/* Top brand strip — echoes the site's black announcement bar */
.brand-strip{
  text-align:center;
  padding:10px 12px;
  background:var(--color-button-bg);
  color:var(--color-accent);
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.02em;
  border-radius:var(--radius-card);
  margin-bottom:28px;
}

/* Progress dots */
.progress-wrap{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:36px;
  opacity:0;
  transition:opacity .3s ease;
}
.progress-wrap.visible{opacity:1;}
.progress-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--color-progress-track);
  transition:background .3s ease, transform .3s ease;
}
.progress-dot.filled{
  background:var(--color-progress);
  transform:scale(1.15);
}
.progress-dot.current{
  background:var(--color-progress);
  box-shadow:0 0 0 3px var(--color-accent-soft);
}

/* Screen / card */
.screen{
  display:none;
  animation:fadeIn .45s ease;
}
.screen.active{display:block;}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(8px);}
  to{opacity:1; transform:translateY(0);}
}

/* Staggered result reveal — each element fades up in sequence
   rather than the whole card appearing at once */
.reveal{
  opacity:0;
  animation: revealUp .55s ease forwards;
}
@keyframes revealUp{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.reveal-1{ animation-delay: .05s; }
.reveal-2{ animation-delay: .35s; }
.reveal-3{ animation-delay: .65s; }
.reveal-4{ animation-delay: .95s; }
.reveal-5{ animation-delay: 1.2s; }
@media (prefers-reduced-motion:reduce){
  .reveal{ opacity:1; animation:none; }
}

/* Logo marks — full logo on the cover, small circular emblem on
   question screens. Both derived from the Kokon Coaching logo. */
.logo-full{
  display:block;
  width:132px;
  height:132px;
  margin:0 auto 26px;
}
.logo-full-small{
  display:block;
  width:76px;
  height:76px;
  margin:0 auto 20px;
}
.logo-emblem{
  display:block;
  width:56px;
  height:56px;
  margin:0 auto 22px;
}
.tagline-mark{
  display:block;
  text-align:center;
  font-family:var(--font-label);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--color-accent);
  margin:0 0 24px;
}

/* Script accent — set in a font matched to the "Give Your Life
   Wings" tagline script already used in the Kokon Coaching logo */
.script-accent{
  display:block;
  font-family:var(--font-script);
  font-size:30px;
  color:var(--color-accent);
  text-align:center;
  margin:0 0 8px;
  line-height:1.2;
}

.eyebrow{
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-text-muted);
  text-align:center;
  margin:0 0 14px;
}

h1.headline{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(28px, 5.2vw, 40px);
  line-height:1.15;
  text-align:center;
  margin:0 0 20px;
  letter-spacing:-0.01em;
}
h1.headline em{
  font-style:normal;
  color:var(--color-accent);
}

p.lede{
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.6;
  color:var(--color-text-muted);
  text-align:center;
  max-width:480px;
  margin:0 auto 32px;
}

/* How it works block */
.how-it-works{
  background:var(--color-bg-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-card);
  padding:28px 26px;
  margin:0 0 28px;
}
.how-it-works h2{
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-text-muted);
  margin:0 0 20px;
  text-align:center;
}
.hiw-step{
  display:flex;
  gap:16px;
  align-items:flex-start;
  margin-bottom:18px;
}
.hiw-step:last-child{margin-bottom:0;}
.hiw-num{
  flex:0 0 auto;
  width:28px; height:28px;
  border-radius:50%;
  border:1px solid var(--color-accent);
  color:var(--color-accent);
  font-family:var(--font-label);
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
}
.hiw-text strong{
  display:block;
  font-family:var(--font-body);
  font-weight:600;
  font-size:15.5px;
  margin-bottom:3px;
}
.hiw-text span{
  font-size:14.5px;
  color:var(--color-text-muted);
  line-height:1.5;
}

.reassurance{
  font-size:15px;
  line-height:1.65;
  color:var(--color-text-muted);
  text-align:center;
  max-width:460px;
  margin:0 auto 32px;
  font-style:italic;
}

/* Buttons */
.btn-primary{
  display:block;
  width:100%;
  background:var(--color-button-bg);
  color:var(--color-button-text);
  border:none;
  border-radius:var(--radius-pill);
  font-family:var(--font-label);
  font-size:15.5px;
  letter-spacing:0.01em;
  padding:17px 24px;
  cursor:pointer;
  text-align:center;
  transition:transform .15s ease, opacity .15s ease;
  text-decoration:none;
}
.btn-primary.pulse{
  animation: btnPulse 2.6s ease-in-out infinite;
}
@keyframes btnPulse{
  0%, 100% { box-shadow: 0 0 0 0 var(--color-accent-soft); }
  50% { box-shadow: 0 0 0 10px rgba(198,160,107,0); }
}
.question-preview{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:20px;
}
.question-preview span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--color-border);
}
.question-preview span:first-child{
  background:var(--color-accent);
}
.question-preview-caption{
  font-family:var(--font-label);
  font-size:11.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--color-text-muted);
  text-align:center;
  margin-top:10px;
}
@media (prefers-reduced-motion:reduce){
  .btn-primary.pulse{animation:none;}
}
.btn-primary:hover{opacity:0.88; transform:translateY(-1px);}
.btn-secondary{
  display:block;
  width:100%;
  background:transparent;
  color:var(--color-text);
  border:1px solid var(--color-border);
  border-radius:var(--radius-pill);
  font-family:var(--font-label);
  font-size:14.5px;
  padding:14px 24px;
  cursor:pointer;
  text-align:center;
  margin-top:12px;
  transition:border-color .15s ease;
}
.btn-secondary:hover{border-color:var(--color-accent);}

/* Question screens */
.q-number{
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-accent);
  text-align:center;
  margin:0 0 10px;
}
h2.q-text{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(22px, 4.4vw, 27px);
  line-height:1.3;
  text-align:center;
  margin:0 0 30px;
}
.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:8px;
}
.answer-btn{
  position:relative;
  text-align:left;
  background:var(--color-bg-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-card);
  padding:17px 44px 17px 20px;
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.5;
  color:var(--color-text);
  cursor:pointer;
  transition:border-color .18s ease, background .18s ease, transform .18s ease;
}
.answer-btn:hover{
  border-color:var(--color-accent);
  background:var(--color-accent-soft);
}
.answer-btn.selected{
  border-color:var(--color-accent);
  background:var(--color-accent-soft);
  transform:scale(0.985);
}
.answer-check{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%) scale(0);
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--color-accent);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.answer-btn.selected .answer-check{
  transform:translateY(-50%) scale(1);
}
.answer-check svg{
  width:11px;
  height:11px;
}

.nav-row{
  display:flex;
  justify-content:center;
  margin-top:22px;
}
.link-btn{
  background:none;
  border:none;
  font-family:var(--font-label);
  font-size:14px;
  color:var(--color-text-muted);
  text-decoration:underline;
  cursor:pointer;
  padding:6px;
}
.link-btn:hover{color:var(--color-text);}

/* Result screen */
.result-card{
  background:var(--color-bg-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-card);
  padding:36px 30px;
  margin-bottom:20px;
}
.result-eyebrow{
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-text-muted);
  text-align:center;
  margin:0 0 12px;
}
.result-intro{
  font-family:var(--font-display);
  font-weight:600;
  font-style:italic;
  font-size:19px;
  color:var(--color-text);
  text-align:center;
  margin:0 0 16px;
}
.thank-you-script{
  font-family:var(--font-script);
  font-size:28px;
  color:var(--color-accent);
  text-align:center;
  margin:0 0 6px;
  line-height:1.25;
}
.thank-you-subtext{
  font-size:14.5px;
  line-height:1.6;
  color:var(--color-text-muted);
  text-align:center;
  max-width:380px;
  margin:0 auto 26px;
}
.result-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(24px, 4.8vw, 30px);
  text-align:center;
  margin:0 0 18px;
  color:var(--color-text);
}
.result-body{
  font-size:16px;
  line-height:1.7;
  color:var(--color-text-muted);
  text-align:center;
  margin:0 0 26px;
}
.result-secondary{
  font-size:14px;
  line-height:1.6;
  color:var(--color-text-muted);
  text-align:center;
  border-top:1px solid var(--color-border);
  padding-top:18px;
  margin-top:22px;
  font-style:italic;
}
.restart-row{
  text-align:center;
  margin-top:18px;
}

@media (max-width:480px){
  body{padding:20px 16px 40px;}
  .how-it-works{padding:22px 18px;}
  .result-card{padding:28px 20px;}
}

@media (prefers-reduced-motion:reduce){
  .screen{animation:none;}
  .btn-primary:hover{transform:none;}
}

/* Footer — persistent across every screen */
.site-footer{
  /* Theme variables — Option B (warm taupe) by default;
     overridden by .result-theme below for Option A (inverted) */
  --footer-bg: #F0E7D8;
  --footer-border: #DCCEB4;
  --footer-text: #4A4136;
  --footer-muted: var(--color-text-muted);
  --footer-btn-bg: var(--color-button-bg);
  --footer-btn-text: var(--color-button-text);
  --footer-link: var(--color-text-muted);
  --footer-link-hover: var(--color-accent);

  width:100%;
  max-width:var(--max-width);
  margin:44px auto 0;
  padding:30px 20px 34px;
  background:var(--footer-bg);
  border-top:1px solid var(--footer-border);
  border-radius:var(--radius-card);
  text-align:center;
  transition:background .3s ease, border-color .3s ease;
}
.site-footer.result-theme{
  --footer-bg: #1B1815;
  --footer-border: #1B1815;
  --footer-text: #E9E2D3;
  --footer-muted: #B8AE9C;
  --footer-btn-bg: var(--color-accent);
  --footer-btn-text: #1B1815;
  --footer-link: #C6A06B;
  --footer-link-hover: #E9E2D3;
}
.footer-cta{
  display:none;
}
.footer-cta.show{
  display:block;
}
.footer-cta-text{
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.6;
  color:var(--footer-text);
  max-width:420px;
  margin:0 auto 16px;
}
.footer-cta-btn{
  display:inline-block;
  background:var(--footer-btn-bg);
  color:var(--footer-btn-text);
  font-family:var(--font-label);
  font-size:14px;
  letter-spacing:0.01em;
  padding:13px 22px;
  border-radius:var(--radius-pill);
  text-decoration:none;
  margin-bottom:28px;
  transition:opacity .15s ease, transform .15s ease;
}
.footer-cta-btn:hover{
  opacity:0.88;
  transform:translateY(-1px);
}
.footer-copyright{
  font-family:var(--font-label);
  font-size:11.5px;
  color:var(--footer-muted);
  margin:0 0 10px;
}
.footer-disclaimer{
  font-family:var(--font-body);
  font-size:10.5px;
  line-height:1.6;
  color:var(--footer-muted);
  opacity:0.85;
  max-width:460px;
  margin:0 auto 14px;
}
.footer-links{
  font-family:var(--font-label);
  font-size:11px;
  color:var(--footer-muted);
  margin:0;
}
.footer-links a{
  color:var(--footer-link);
  text-decoration:underline;
  text-underline-offset:2px;
  transition:color .15s ease;
}
.footer-links a:hover{
  color:var(--footer-link-hover);
}
.footer-links .sep{
  margin:0 8px;
  color:var(--footer-border);
}

@media (max-width:480px){
  .site-footer{padding:24px 16px 28px;}

}
</style>

    { label: "Privacy Policy & Health Disclaimer", url: "https://www.kokoncoaching.co.nz/disclaimer" }
  ]
};

/* ============================================================
   APPLICATION LOGIC
   Scoring, navigation and rendering. No external calls, no AI,
   no data collection — all state lives in memory only and is
   discarded on refresh.
   ============================================================ */
(function(){
  const state = {
    currentIndex: -1, // -1 = cover screen
    answers: {},       // questionId -> outcome key selected
  };

  const screensEl = document.getElementById('screens');
  const progressWrap = document.getElementById('progressWrap');
  const brandStrip = document.getElementById('brandStrip');

  brandStrip.textContent = QUIZ_CONFIG.brand.stripText;

  const totalQuestions = QUIZ_CONFIG.questions.length;

  function buildProgressDots(){
    progressWrap.innerHTML = '';
    for(let i = 0; i < totalQuestions; i++){
      const dot = document.createElement('div');
      dot.className = 'progress-dot';
      dot.dataset.index = i;
      progressWrap.appendChild(dot);
    }
  }

  function updateProgressDots(activeIndex){
    const dots = progressWrap.querySelectorAll('.progress-dot');
    dots.forEach((dot, i) => {
      dot.classList.remove('filled', 'current');
      if(i < activeIndex) dot.classList.add('filled');
      if(i === activeIndex) dot.classList.add('current');
    });
  }

  function renderScreenMark(){
    const mode = QUIZ_CONFIG.brand.questionMark;
    if(mode === 'tagline'){
      return `<p class="tagline-mark">${QUIZ_CONFIG.brand.taglineText}</p>`;
    }
    if(mode === 'emblem'){
      return `<img class="logo-emblem" src="${QUIZ_CONFIG.brand.logoEmblem}" alt="">`;
    }
    // default: "logo"
    return `<img class="logo-full-small" src="${QUIZ_CONFIG.brand.logoFull}" alt="Kokon Coaching logo">`;
  }

  function buildCoverScreen(){
    const c = QUIZ_CONFIG.cover;
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'screen-cover';

    const stepsHtml = c.steps.map((s, i) => `
      <div class="hiw-step">
        <div class="hiw-num">${i+1}</div>
        <div class="hiw-text">
          <strong>${s.title}</strong>
          <span>${s.text}</span>
        </div>
      </div>
    `).join('');

    div.innerHTML = `
      <img class="logo-full" src="${QUIZ_CONFIG.brand.logoFull}" alt="Kokon Coaching logo">
      ${c.scriptAccent ? `<span class="script-accent">${c.scriptAccent}</span>` : ''}
      <h1 class="headline">${c.headline}</h1>
      <p class="lede">${c.lede}</p>
      <div class="how-it-works">
        <h2>${c.howItWorksLabel}</h2>
        ${stepsHtml}
      </div>
      <p class="reassurance">${c.reassurance}</p>
      <button class="btn-primary pulse" id="startBtn">${c.ctaText}</button>
      ${c.showQuestionPreview ? `
      <div class="question-preview">${QUIZ_CONFIG.questions.map((q,i) => '<span></span>').join('')}</div>
      <p class="question-preview-caption">${c.questionPreviewCaption}</p>
      ` : ''}
    `;
    screensEl.appendChild(div);
    div.querySelector('#startBtn').addEventListener('click', () => goTo(0));
  }

  function buildQuestionScreen(q, index){
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'screen-' + q.id;

    const answersHtml = q.answers.map(a => `
      <button class="answer-btn" data-outcome="${a.outcome}" data-qid="${q.id}" data-aid="${a.id}">
        ${a.text}
        <span class="answer-check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      </button>
    `).join('');

    div.innerHTML = `
      ${renderScreenMark()}
      <div class="q-number">Question ${index+1} of ${totalQuestions}</div>
      <h2 class="q-text">${q.prompt}</h2>
      <div class="answers">${answersHtml}</div>
      <div class="nav-row">
        ${index > 0 ? '<button class="link-btn" id="backBtn-'+q.id+'">← Back</button>' : ''}
      </div>
    `;
    screensEl.appendChild(div);

    div.querySelectorAll('.answer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // visually mark selection
        div.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.answers[q.id] = btn.getAttribute('data-outcome');
        // small delay so the selection state is visible before advancing
        setTimeout(() => {
          if(index < totalQuestions - 1){
            goTo(index + 1);
          } else {
            showResult();
          }
        }, 180);
      });
    });

    const backBtn = div.querySelector('#backBtn-' + q.id);
    if(backBtn){
      backBtn.addEventListener('click', () => goTo(index - 1));
    }
  }

  function buildResultScreen(){
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'screen-result';
    screensEl.appendChild(div);
  }

  function goTo(index){
    state.currentIndex = index;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    setFooterCtaVisible(false);
    setFooterResultTheme(false);
    if(index === -1){
      document.getElementById('screen-cover').classList.add('active');
      progressWrap.classList.remove('visible');
    } else {
      const q = QUIZ_CONFIG.questions[index];
      document.getElementById('screen-' + q.id).classList.add('active');
      progressWrap.classList.add('visible');
      updateProgressDots(index);
    }
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  /* ---- Scoring ---- */
  function computeScores(){
    const scores = {};
    Object.keys(QUIZ_CONFIG.outcomes).forEach(k => scores[k] = 0);
    const coreScores = {};
    Object.keys(QUIZ_CONFIG.outcomes).forEach(k => coreScores[k] = 0);

    QUIZ_CONFIG.questions.forEach((q, i) => {
      const chosen = state.answers[q.id];
      if(!chosen) return;
      const weight = QUIZ_CONFIG.weights[i] || 1;
      scores[chosen] += weight;
      if(i < 4){ // Q1–Q4 core
        coreScores[chosen] += weight;
      }
    });

    return { scores, coreScores };
  }

  function resolveWinner(scores, coreScores){
    // Step 1: highest total score
    let max = Math.max(...Object.values(scores));
    let leaders = Object.keys(scores).filter(k => scores[k] === max);
    if(leaders.length === 1) return leaders[0];

    // Step 2: recount using core-only scores among tied leaders
    let coreMax = Math.max(...leaders.map(k => coreScores[k]));
    let coreLeaders = leaders.filter(k => coreScores[k] === coreMax);
    if(coreLeaders.length === 1) return coreLeaders[0];

    // Step 3: Q4 answer decides, if its outcome is among the tied leaders
    const q4Outcome = state.answers['q4'];
    if(q4Outcome && coreLeaders.includes(q4Outcome)) return q4Outcome;

    // Step 4: fixed fallback priority order
    for(const key of QUIZ_CONFIG.fallbackPriority){
      if(coreLeaders.includes(key)) return key;
    }
    return coreLeaders[0];
  }

  function showResult(){
    updateProgressDots(totalQuestions);
    const { scores, coreScores } = computeScores();
    const winnerKey = resolveWinner(scores, coreScores);
    const outcome = QUIZ_CONFIG.outcomes[winnerKey];

    // Determine an optional secondary acknowledgement
    let secondaryHtml = '';
    if(QUIZ_CONFIG.secondary.showSecondary){
      const others = Object.keys(scores).filter(k => k !== winnerKey);
      let secondKey = others.reduce((best, k) => scores[k] > scores[best] ? k : best, others[0]);
      const secondScore = scores[secondKey];
      const primaryScore = scores[winnerKey];
      if(primaryScore > 0 && (secondScore / primaryScore) >= QUIZ_CONFIG.secondary.threshold && secondScore > 0){
        const secondLabel = QUIZ_CONFIG.outcomes[secondKey].label;
        secondaryHtml = `<p class="result-secondary reveal reveal-5">${QUIZ_CONFIG.secondary.template(secondLabel)}</p>`;
      }
    }

    const resultDiv = document.getElementById('screen-result');
    resultDiv.innerHTML = `
      ${renderScreenMark()}
      <p class="thank-you-script reveal reveal-1">${QUIZ_CONFIG.thankYouMessage}</p>
      <p class="thank-you-subtext reveal reveal-1">${QUIZ_CONFIG.thankYouSubtext}</p>
      <p class="result-intro reveal reveal-2">Based on what you've told me</p>
      <div class="result-card">
        <p class="result-eyebrow reveal reveal-2" style="margin-bottom:6px;">${outcome.label}</p>
        <h2 class="result-title reveal reveal-3">${outcome.title}</h2>
        <p class="result-body reveal reveal-4">${outcome.body}</p>
        <a class="btn-primary reveal reveal-5" href="${outcome.resourceUrl}" target="_blank" rel="noopener">${outcome.resourceLabel} →</a>
        <p class="reveal reveal-5" style="font-size:12.5px;color:var(--color-text-muted);text-align:center;margin-top:10px;">${outcome.resourceNote}</p>
        ${secondaryHtml}
      </div>
      <div class="restart-row">
        <button class="btn-secondary" id="restartBtn">${QUIZ_CONFIG.restartLabel}</button>
      </div>
    `;

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    resultDiv.classList.add('active');
    setFooterResultTheme(true);
    setFooterCtaVisible(winnerKey !== 'personal');
    window.scrollTo({top: 0, behavior: 'smooth'});

    document.getElementById('restartBtn').addEventListener('click', () => {
      state.answers = {};
      document.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));
      goTo(-1);
    });
  }

  function renderFooter(){
    const footerEl = document.getElementById('siteFooter');
    if(!footerEl) return;
    const linksHtml = FOOTER_CONFIG.links
      .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
      .join('<span class="sep">·</span>');
    footerEl.innerHTML = `
      <div class="footer-cta" id="footerCta">
        <p class="footer-cta-text">${FOOTER_CONFIG.ctaText}</p>
        <a class="footer-cta-btn" href="${FOOTER_CONFIG.ctaButtonUrl}" target="_blank" rel="noopener">${FOOTER_CONFIG.ctaButtonText} →</a>
      </div>
      <p class="footer-copyright">${FOOTER_CONFIG.copyright}</p>
      <p class="footer-disclaimer">${FOOTER_CONFIG.disclaimer}</p>
      <p class="footer-links">${linksHtml}</p>
    `;
  }

  function setFooterCtaVisible(visible){
    const cta = document.getElementById('footerCta');
    if(cta) cta.classList.toggle('show', visible);
  }

  function setFooterResultTheme(active){
    const footerEl = document.getElementById('siteFooter');
    if(footerEl) footerEl.classList.toggle('result-theme', active);
  }

  /* ---- Build ---- */
  buildProgressDots();
  buildCoverScreen();
  QUIZ_CONFIG.questions.forEach((q, i) => buildQuestionScreen(q, i));
  buildResultScreen();
  renderFooter();
  goTo(-1);

})();
</script>

</body>
</html>
